[project]
name = "marketplace-backend"
version = "0.1.0"
description = "Stateless Marketplace API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn>=0.34,<1",
  "boto3>=1.40,<2",
  "pillow>=13,<14",
  "redis>=6.4,<7",
]

[dependency-groups]
dev = [
 "httpx2>=2.16.0",
 "pytest>=8.3,<10",
 "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
