# Reuse the existing control-plane -> worker TCP/10250 security group rule.
# A separate port prevents a collision with the control-plane kubelet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: metrics-server
          args:
            - --cert-dir=/tmp
            - --secure-port=10251
            - --kubelet-preferred-address-types=InternalIP
            - --kubelet-use-node-status-port
            - --metric-resolution=15s
          ports:
            - $patch: replace
            - containerPort: 10251
              name: https
              protocol: TCP
