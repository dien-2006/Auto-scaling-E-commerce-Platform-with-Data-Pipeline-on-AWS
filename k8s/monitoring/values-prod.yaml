# For real production durability configure EBS CSI + StorageClass and enable PVCs.
# This example deliberately leaves persistence disabled until a CSI driver is ready.
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  persistence:
    enabled: false
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec: {}
alertmanager:
  enabled: true
