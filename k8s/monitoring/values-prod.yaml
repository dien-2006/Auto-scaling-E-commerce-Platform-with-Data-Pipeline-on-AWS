# Overrides: pass values-dev.yaml first, then this file. Single replica, not HA.
kubelet:
  serviceMonitor:
    tlsConfig:
      insecureSkipVerify: false # requires CA-signed kubelet serving certificates
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: coco-monitoring-gp3
    size: 5Gi
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 24GB
    externalLabels:
      cluster: coco-prod
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: coco-monitoring-gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 30Gi
alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi
