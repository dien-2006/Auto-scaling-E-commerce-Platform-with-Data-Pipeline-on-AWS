apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backend-metrics.yaml
  - frontend-metrics.yaml
  - blackbox.yaml
  - probes.yaml
  - rules.yaml
configMapGenerator:
  - name: coco-application-dashboard
    namespace: monitoring
    files:
      - coco-application.json=dashboards/coco-application.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
