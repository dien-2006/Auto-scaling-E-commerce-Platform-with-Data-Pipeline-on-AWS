apiVersion: apps/v1
kind: Deployment
metadata:
  name: coco-otp-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coco-otp-redis
  template:
    metadata:
      labels:
        app: coco-otp-redis
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: 'false'
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: [--save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, noeviction]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: coco-otp-redis
spec:
  type: ClusterIP
  selector:
    app: coco-otp-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
