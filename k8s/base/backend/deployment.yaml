apiVersion: apps/v1
kind: Deployment
metadata:
  name: coco-backend
spec:
  # HPA owns replicas; minReplicas=2 is defined in hpa.yaml.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: coco-backend
  template:
    metadata:
      labels:
        app: coco-backend
      annotations:
        checksum/runtime-config: REPLACE_WITH_RUNTIME_CHECKSUM
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: coco-backend
      containers:
        - name: backend
          image: coco-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: coco-backend-config
            - secretRef:
                name: coco-backend-secret
          resources:
            requests:
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
