apiVersion: apps/v1
kind: Deployment
metadata:
  name: coco-frontend
spec:
  # HPA owns replicas; minReplicas=2 is defined in hpa.yaml.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: coco-frontend
  template:
    metadata:
      labels:
        app: coco-frontend
      annotations:
        checksum/runtime-config: REPLACE_WITH_RUNTIME_CHECKSUM
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: coco-frontend
      containers:
        - name: frontend
          image: coco-frontend:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: coco-frontend-config
          env:
            - name: MARKETPLACE_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: coco-backend-secret
                  key: MARKETPLACE_PROXY_SECRET
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9091
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
