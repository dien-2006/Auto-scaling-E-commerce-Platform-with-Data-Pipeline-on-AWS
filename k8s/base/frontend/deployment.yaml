apiVersion: apps/v1
kind: Deployment
metadata:
  name: coco-frontend
spec:
  # HPA owns replicas; minReplicas=2 is defined in hpa.yaml.
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: coco-frontend
  template:
    metadata:
      labels:
        app: coco-frontend
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: coco-frontend
      containers:
        - name: frontend
          image: coco-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
