# Direct Internet -> Nginx -> Next.js -> FastAPI.
# A load balancer/CDN in front needs its own trusted-proxy configuration first.
server {
    listen 80;
    server_name _;
    access_log off;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Supply existing certificates manually before starting Nginx.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # Re-resolve Docker DNS when the frontend container is replaced.
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite browser-supplied IPs; never trust an incoming chain.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Marketplace-Client-IP "";
        proxy_set_header X-Marketplace-Client-Signature "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
